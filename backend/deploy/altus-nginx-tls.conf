# Nginx para SIGH / Altus — con TLS.
#
# NO se instala a mano: lo hace `preparar-tls.sh`, que además emite el
# certificado y comprueba que todo responde antes de dejarlo puesto.
#
#     sudo bash backend/deploy/preparar-tls.sh
#
# Sustituye a altus-nginx.conf (el de sólo HTTP), que se conserva en el
# repositorio para instalaciones de desarrollo.
#
# ── POR QUÉ HACE FALTA TLS, Y NO ES UN EXTRA ────────────────────────────────
# Sin cifrado, la contraseña de cada usuario y la cookie de sesión viajan en
# claro por la red de la clínica. Cualquiera conectado al mismo wifi puede
# leerlas y entrar como administrador.
#
# Y hay un segundo motivo, más prosaico: Medusa marca la cookie de sesión como
# `Secure` en producción, y el navegador se niega a guardar una cookie `Secure`
# servida por HTTP. Por eso hoy hace falta ALLOW_INSECURE_COOKIES=1. Con TLS esa
# bandera desaparece y el problema con ella.

# ── Puerto 80: sólo para mandar a HTTPS ─────────────────────────────────────
#
# Se conserva escuchando en 80 a propósito. Quien tenga guardada la dirección
# antigua, o teclee la IP sin más, llega igual — redirigido. Cerrar el 80 del
# todo sólo conseguiría que la gente viera "no se puede conectar" y pensara que
# el servidor está caído.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # /health se atiende también por HTTP: es la sonda con la que `altus estado`
    # comprueba el backend desde la propia máquina, y no tiene sentido obligarla
    # a validar un certificado contra sí misma.
    location /health {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Puerto 443: el servicio de verdad ───────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/altus/tls/servidor.crt;
    ssl_certificate_key /etc/altus/tls/servidor.key;

    # TLS 1.2 y 1.3. Se deja 1.2 porque algún equipo viejo de la clínica podría
    # no hablar 1.3, y quedarse fuera del sistema por eso sería un problema
    # mayor del que se resuelve quitándolo.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:AltusTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── SIN HSTS, a propósito ───────────────────────────────────────────────
    # HSTS le dice al navegador "esta dirección SIEMPRE por https, y no
    # aceptes excusas". Suena bien y aquí sería una trampa: si el certificado
    # caduca o hay que volver atrás un rato, los navegadores de la clínica se
    # negarían a abrir el sistema por HTTP y no habría forma de entrar desde
    # ellos hasta limpiar la configuración equipo por equipo.
    #
    # Además no serviría para el caso principal: HSTS no se aplica a
    # direcciones IP, que es como entra casi todo el mundo aquí.

    # Que no se adivine la versión de nginx.
    server_tokens off;

    client_max_body_size 25M;

    # ── POS ─────────────────────────────────────────────────────────────────
    root /var/www/altus-pos;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend Medusa ──────────────────────────────────────────────────────
    location ~ ^/(app|admin|auth|store|static|health) {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Con TLS esto vale "https", y es lo que hace que Medusa entienda que
        # la conexión del usuario es segura aunque el proxy le hable por HTTP
        # en el 9000. Sin esta cabecera seguiría rechazando la cookie Secure.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
    }
}
