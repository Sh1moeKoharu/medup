# Nginx para SIGH / Altus.
#
# Instalación:
#   sudo cp backend/deploy/altus-nginx.conf /etc/nginx/sites-available/altus
#   sudo ln -sfn /etc/nginx/sites-available/altus /etc/nginx/sites-enabled/altus
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── POR QUÉ TODO EN UN MISMO ORIGEN ─────────────────────────────────────────
# El POS y el panel se sirven desde aquí, y las rutas de la API se reenvían al
# backend en el puerto 9000. Todo queda bajo el mismo origen, lo que evita CORS
# por completo: no hay que declarar cada dispositivo ni cada IP en ADMIN_CORS.
#
# Servir el POS en otro puerto obligaría a mantener una lista de orígenes y a
# recompilar cada vez que cambie una dirección.
#
# ── CUANDO SE AGREGUE TLS ───────────────────────────────────────────────────
# `certbot --nginx` reescribe este archivo para escuchar en 443. A partir de
# ahí puede eliminarse ALLOW_INSECURE_COOKIES del entorno: con HTTPS la cookie
# de sesión ya se guarda correctamente marcada como Secure.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Los reportes y catálogos pueden ser grandes.
    client_max_body_size 25M;

    # ── POS (aplicación estática compilada con `npm run build:web`) ─────────
    root /var/www/altus-pos;
    index index.html;

    location / {
        # Es una SPA: cualquier ruta desconocida debe devolver index.html para
        # que el enrutador del cliente se encargue. Sin esto, recargar en
        # /cart o /orders daría 404.
        try_files $uri $uri/ /index.html;
    }

    # ── Backend Medusa ──────────────────────────────────────────────────────
    # /app     panel de administración
    # /admin   API de administración
    # /auth    autenticación
    # /store   API de tienda
    # /static  archivos subidos (imágenes de producto)
    # /health  sonda de estado
    location ~ ^/(app|admin|auth|store|static|health) {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # La bitácora registra la IP de origen: sin estas cabeceras todas las
        # acciones quedarían registradas como provenientes de 127.0.0.1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necesario para websockets y respuestas en streaming.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # El arranque de workflows largos puede tardar más que el valor por
        # omisión de 60s.
        proxy_read_timeout 300s;
    }
}
